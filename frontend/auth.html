<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Saarthi</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        rel="stylesheet"
    >


    <!-- Saarthi styles -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav class="navbar">

        <div class="nav-container">

            <a
                href="index.html"
                class="logo"
            >

                <i class="fa-solid fa-car-side"></i>

                <span>Saarthi</span>

            </a>


            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="cars.html">
                    Browse Cars
                </a>

                <a href="ai-trip-planner.html">
                    AI Trip Planner
                </a>

                <a href="host.html">
                    Host Your Car
                </a>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         AUTH PAGE
    ====================================================== -->

    <main class="auth-page">


        <section class="auth-card">


            <!-- Header -->

            <div class="auth-header">

                <span class="auth-eyebrow">

                    <i class="fa-solid fa-shield-halved"></i>

                    Saarthi account

                </span>


                <h1 id="authTitle">
                    Welcome back
                </h1>


                <p id="authSubtitle">
                    Log in to manage your bookings and trips.
                </p>

            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                class="auth-form"
            >


                <div class="auth-form-group">

                    <label for="loginEmail">
                        Email address
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="auth-form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    id="loginBtn"
                    class="auth-submit-btn"
                    type="submit"
                >

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Log In

                </button>


                <div
                    id="loginError"
                    class="auth-error hidden"
                ></div>

            </form>


            <!-- =================================================
                 REGISTER FORM
            ================================================== -->

            <form
                id="registerForm"
                class="auth-form hidden"
            >


                <div class="auth-form-group">

                    <label for="registerName">
                        Full name
                    </label>

                    <input
                        id="registerName"
                        type="text"
                        autocomplete="name"
                        placeholder="Your full name"
                        required
                    >

                </div>


                <div class="auth-form-group">

                    <label for="registerEmail">
                        Email address
                    </label>

                    <input
                        id="registerEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="auth-form-group">

                    <label for="registerPhone">
                        Mobile number
                    </label>

                    <input
                        id="registerPhone"
                        type="tel"
                        inputmode="numeric"
                        maxlength="10"
                        autocomplete="tel"
                        placeholder="10-digit mobile number"
                        required
                    >

                </div>


                <div class="auth-form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        id="registerPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Minimum 6 characters"
                        required
                    >

                </div>


                <div class="auth-form-group">

                    <label for="registerRole">
                        Account type
                    </label>

                    <select id="registerRole">

                        <option value="customer">
                            Customer
                        </option>

                        <option value="host">
                            Host
                        </option>

                    </select>

                </div>


                <button
                    id="registerBtn"
                    class="auth-submit-btn"
                    type="submit"
                >

                    <i class="fa-solid fa-user-plus"></i>

                    Create Account

                </button>


                <div
                    id="registerError"
                    class="auth-error hidden"
                ></div>

            </form>


            <!-- =================================================
                 MODE SWITCH
            ================================================== -->

            <div class="auth-switch">

                <span id="switchText">
                    Don't have an account?
                </span>


                <button
                    id="switchAuthMode"
                    type="button"
                >
                    Register
                </button>

            </div>


        </section>

    </main>


    <!-- JavaScript -->

    <script src="js/pages/auth.js"></script>
    <script src="js/core/auth-ui.js"></script>

</body>

</html>
